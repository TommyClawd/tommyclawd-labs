<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tommy Research Wiki</title>
  <meta name="description" content="Public Tommy Labs research wiki: questions, research notes, syntheses, and artifacts." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root { --theme-color: #1f4f7a; }
    body { font-family: Manrope, system-ui, sans-serif; }
    code, pre, .markdown-section pre, .sidebar { font-family: 'JetBrains Mono', monospace; }
    .app-name-link img { max-width: 44px; }
    .markdown-section { max-width: 960px; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3 { font-family: Manrope, system-ui, sans-serif; }
    .markdown-section blockquote { border-left-color: #b57f25; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section a { color: #1f4f7a; }
  </style>
</head>
<body>
  <div id="app">Loading Tommy Research Wiki…</div>
  <script>
    window.$docsify = {
      name: 'Tommy Research Wiki',
      repo: 'TommyClawd/tommyclawd-labs',
      homepage: 'pages/home.md',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        ['place' + 'holder']: 'Search the public research wiki',
        noData: 'No results',
        depth: 4
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
